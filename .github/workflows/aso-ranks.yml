name: aso-ranks

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out rank history
        run: |
          git fetch origin aso-ranks && git worktree add ranks origin/aso-ranks || { git worktree add --detach ranks && git -C ranks checkout --orphan aso-ranks && git -C ranks rm -rfq .; }

      - name: Record ranks
        run: node scripts/aso-ranks.mjs ranks/ranks.csv

      - name: Commit
        working-directory: ranks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranks.csv
          git commit -m "ranks $(date -u +%F)"
          git push origin HEAD:aso-ranks

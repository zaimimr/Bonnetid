buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def appVersion = new groovy.json.JsonSlurper().parse(file("$rootDir/../app.json")).expo.version
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

android {
  namespace 'no.irn.bonnetid.wear'
  compileSdk rootProject.ext.compileSdkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion

  defaultConfig {
    applicationId 'no.irn.bonnetid'
    minSdkVersion 30
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1_000_000 + major * 10_000 + minor * 100 + patch
    versionName appVersion
  }

  sourceSets {
    main {
      java.srcDirs += "$rootDir/../modules/prayer-widget/android/src/shared/java"
    }
  }

  signingConfigs {
    debug {
      storeFile file("$rootDir/app/debug.keystore")
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.wear.compose:compose-material3:1.6.2'
  implementation 'androidx.wear.compose:compose-foundation:1.6.2'
  implementation 'androidx.wear.tiles:tiles:1.6.2'
  implementation 'androidx.wear.protolayout:protolayout:1.4.2'
  implementation 'androidx.wear.watchface:watchface-complications-data-source:1.3.0'
  implementation 'androidx.concurrent:concurrent-futures:1.3.0'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}

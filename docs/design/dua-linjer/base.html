<title>Dua-kunst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#F6F8F7;--surface:#FFFFFF;--fg:#182420;--muted:#5F6E67;--line:#DDE4E0;--accent:#0C6B52;--accent-soft:#E9F4EF;--on-soft:#095844;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1714;--surface:#17211D;--fg:#E6EEEA;--muted:#9AABA3;--line:#2A3732;--accent:#5CC29B;--accent-soft:#1C3229;--on-soft:#A9E3CB;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1714;--surface:#17211D;--fg:#E6EEEA;--muted:#9AABA3;--line:#2A3732;--accent:#5CC29B;--accent-soft:#1C3229;--on-soft:#A9E3CB;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:32px;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.toggle{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--font);cursor:pointer}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.phone{position:sticky;top:16px;width:100%;max-width:380px;margin:0 auto;border-radius:44px;padding:10px;background:#111816;box-sizing:border-box}
.screen{border-radius:36px;overflow:hidden;background:#F6F8F7;height:760px;max-height:82vh;overflow-y:auto;color:#182420;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.top{position:sticky;top:0;z-index:2;background:#FFFFFF;border-bottom:1px solid #DDE4E0;padding:44px 16px 12px;display:flex;flex-direction:column;gap:12px}
.top h2{margin:0;font-size:28px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:#F0F3F1;color:#5F6E67;font-size:16px}
.feed{display:flex;flex-direction:column;gap:12px;padding:16px}
.sec{font-size:15px;font-weight:600;color:#3E4C46;padding:10px 4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.tile:active{transform:scale(.97)}
.tile.wide{aspect-ratio:auto;height:140px}
.tile.hero{aspect-ratio:auto;height:184px}
.tile svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .lbl{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:2px;max-width:58%;z-index:1}
.tile .lbl b{font-size:16px;font-weight:600;line-height:1.2}
.tile .lbl small{font-size:13px;opacity:.8}
.tile.hero .lbl b{font-size:22px;font-weight:700}
.tile.night .lbl{color:#FFFFFF}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.item{display:flex;flex-direction:column;gap:8px;min-width:0}
.item .tile{aspect-ratio:16/10;cursor:default}
.item .tile:active{transform:none}
.meta{display:flex;flex-direction:column;gap:2px}
.meta b{font-size:15px}
.meta span{font-size:13px;color:var(--muted)}
.meta code{font-size:12px;color:var(--on-soft);background:var(--accent-soft);padding:2px 6px;border-radius:6px;align-self:flex-start}
h3{margin:0 0 4px;font-size:20px}
.art [class*="a-"]{transform-box:fill-box;transform-origin:center}
.art .a-rise{animation:rise 7s ease-in-out infinite alternate}
.art .a-sink{animation:sink 9s ease-in-out infinite alternate}
.art .a-drift{animation:drift 11s ease-in-out infinite alternate}
.art .a-drift-slow{animation:drift 18s ease-in-out infinite alternate}
.art .a-drift-wide{animation:driftw 12s ease-in-out infinite alternate}
.art .a-twinkle{animation:twinkle 3.2s ease-in-out infinite}
.art .a-wave{animation:wave 2.6s ease-in-out infinite}
.art .a-fall{animation:fall 1.8s ease-in infinite}
.art .a-stream{animation:stream 1.2s ease-in-out infinite alternate}
.art .a-ripple{animation:ripple 2s ease-out infinite}
.art .a-fly{animation:fly 5s ease-in-out infinite alternate}
.art .a-fly-slow{animation:fly 7s ease-in-out infinite alternate}
.art .a-spin-slow{animation:spin 60s linear infinite}
.art .a-tawaf{animation:spin 40s linear infinite reverse}
.art .a-sway{transform-origin:50% 0;animation:sway 3.8s ease-in-out infinite alternate}
.art .a-sway-base{transform-origin:50% 100%;animation:swaybase 5s ease-in-out infinite alternate}
.art .a-aurora{transform-origin:50% 0;animation:aurora 10s ease-in-out infinite alternate}
.art .a-glow{animation:glow 3s ease-in-out infinite alternate}
.art .a-win{animation:win 4s ease-in-out infinite alternate}
.art .a-breathe{animation:breathe 6s ease-in-out infinite alternate}
.art .a-leaf{animation:leaf 7s ease-in-out infinite}
.art .a-smoke{animation:smoke 4s ease-out infinite}
.art .a-shimmer{animation:shimmer 3.4s ease-in-out infinite alternate}
.art .a-rain{animation:rain 1.1s linear infinite}
.art .a-snow{animation:snow 8s linear infinite}
.art .a-mote{animation:mote 7s ease-in-out infinite}
.art .a-flame{transform-origin:50% 100%;animation:flame 1.4s ease-in-out infinite alternate}
.art .a-bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(4px)}to{transform:translateY(-4px)}}
@keyframes sink{from{transform:translateY(-3px)}to{transform:translateY(5px)}}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@keyframes driftw{from{transform:translateX(-24px)}to{transform:translateX(10px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wave{0%,100%{opacity:.15}45%{opacity:1}}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{transform:translateY(32px);opacity:1}100%{transform:translateY(36px);opacity:0}}
@keyframes stream{from{transform:scaleX(.8)}to{transform:scaleX(1.15)}}
@keyframes ripple{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes fly{from{transform:translate(-8px,4px)}to{transform:translate(8px,-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes swaybase{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes aurora{from{transform:skewX(-6deg) scaleY(.9);opacity:.75}to{transform:skewX(6deg) scaleY(1.08);opacity:1}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes win{0%,60%{opacity:1}80%{opacity:.7}100%{opacity:1}}
@keyframes breathe{from{opacity:.4}to{opacity:.7}}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(-22px,56px) rotate(200deg);opacity:0}}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(10px,-34px) scale(2.2);opacity:0}}
@keyframes shimmer{from{transform:scaleX(.82);opacity:.7}to{transform:scaleX(1.08);opacity:1}}
@keyframes rain{from{transform:translate(0,-8px);opacity:0}30%{opacity:1}to{transform:translate(-4px,14px);opacity:0}}
@keyframes snow{from{transform:translate(0,-40px)}to{transform:translate(-14px,240px)}}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(6px,-10px);opacity:.9}}
@keyframes flame{from{transform:scale(.92,1) skewX(-4deg)}to{transform:scale(1.06,1.12) skewX(4deg)}}
@keyframes bob{from{transform:translateY(-1.5px) rotate(-2deg)}to{transform:translateY(1.5px) rotate(2deg)}}
.art .a-cross{animation:cross 36s linear infinite}
.art .a-glide{animation:glide 3s ease-in-out infinite alternate}
.art .a-wingL{transform-origin:100% 100%;animation:flap .5s ease-in-out infinite alternate}
.art .a-wingR{transform-origin:0% 100%;animation:flap .5s ease-in-out infinite alternate}
@keyframes cross{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
@keyframes glide{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@keyframes flap{0%{transform:scaleY(1)}100%{transform:scaleY(-.7)}}
.paused .art *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.art *{animation:none!important}.tile{transition:none}}
</style>

<div class="wrap" id="root">
  <header>
    <h1>Dua-kunst</h1>
    <button class="toggle" id="toggle" type="button" aria-pressed="false">Pause animasjon</button>
  </header>
  <div class="layout">
    <div class="phone" aria-label="Dua-siden med illustrasjoner">
      <div class="screen">
        <div class="top">
          <h2>Dua og dhikr</h2>
          <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6E67" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Søk i 180 duaer</div>
        </div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
    <section>
      <h3>Biblioteket</h3>
      <div class="lib" id="lib"></div>
    </section>
  </div>
</div>

<script>
const f=n=>+(+n).toFixed(1);
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const grain=()=>`<rect width="400" height="240" fill="url(#grain)"/>`;
const stars=(seed,n,x0,x1,y0,y1,c='#FFFFFF')=>{const r=rng(seed);let o='';for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0),s=.5+r()*1.2;o+=`<circle class="a-twinkle" style="animation-delay:${f(-r()*4)}s;animation-duration:${f(2.6+r()*2.4)}s" cx="${f(x)}" cy="${f(y)}" r="${f(s)}" fill="${c}"/>`;}return o;};
const spark=(x,y,s,c,d=0)=>`<path class="a-twinkle" style="animation-delay:${d}s" d="M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}Z" fill="${c}"/>`;
const spruce=(x,y,h,c,snow,lit)=>{const w=h*.56,P=(a,b)=>`${f(x+a*w)} ${f(y-b*h)}`;const p=`M${P(0,1)}L${P(.24,.66)}L${P(.14,.66)}L${P(.4,.34)}L${P(.25,.34)}L${P(.5,0)}L${P(-.5,0)}L${P(-.25,.34)}L${P(-.4,.34)}L${P(-.14,.66)}L${P(-.24,.66)}Z`;const r=`M${P(0,1)}L${P(.24,.66)}L${P(.14,.66)}L${P(.4,.34)}L${P(.25,.34)}L${P(.5,0)}L${P(0,0)}Z`;let o=`<rect x="${f(x-h*.035)}" y="${f(y-2)}" width="${f(h*.07)}" height="${f(h*.1)}" fill="#4A3426"/><path d="${p}" fill="${c}"/><path d="${r}" fill="${lit||'#000'}" opacity="${lit?.35:.14}"/>`;if(snow)o+=`<path d="M${P(0,1)}L${P(.13,.82)}L${P(.04,.85)}L${P(-.05,.81)}L${P(-.13,.82)}Z" fill="${snow}"/><path d="M${P(-.4,.34)}L${P(-.2,.4)}L${P(-.06,.36)}L${P(-.25,.32)}Z" fill="${snow}"/><path d="M${P(-.5,0)}L${P(-.26,.06)}L${P(-.08,.02)}L${P(-.3,-.01)}Z" fill="${snow}"/>`;return o;};
const cabin=(x,y,s,o)=>{const W=40*s,H=22*s,R=15*s,l=x-W/2;const win=(wx)=>`<rect x="${f(wx)}" y="${f(y-H*.74)}" width="${f(W*.18)}" height="${f(H*.36)}" fill="${o.win}" ${o.glow?'class="a-win"':''}/><path d="M${f(wx+W*.09)} ${f(y-H*.74)}V${f(y-H*.38)}" stroke="${o.trim}" stroke-width="${f(1*s)}"/><rect x="${f(wx)}" y="${f(y-H*.74)}" width="${f(W*.18)}" height="${f(H*.36)}" fill="none" stroke="${o.trim}" stroke-width="${f(1.4*s)}"/>`;
  return `${o.glow?`<ellipse class="a-glow" cx="${f(x)}" cy="${f(y-H*.5)}" rx="${f(W*1.1)}" ry="${f(H*1.2)}" fill="${o.win}" fill-opacity=".18"/>`:''}
  <rect x="${f(l+W*.66)}" y="${f(y-H-R*.95)}" width="${f(5*s)}" height="${f(R*.75)}" fill="${o.chim||o.roof}"/>
  <rect x="${f(l)}" y="${f(y-H)}" width="${f(W)}" height="${f(H)}" fill="${o.wall}"/>
  <path d="M${f(l)} ${f(y-H+3*s)}H${f(l+W)}M${f(l)} ${f(y-H+8*s)}H${f(l+W)}M${f(l)} ${f(y-H+13*s)}H${f(l+W)}M${f(l)} ${f(y-H+18*s)}H${f(l+W)}" stroke="#000" stroke-opacity=".08" stroke-width="${f(.8*s)}"/>
  <rect x="${f(x+W*.12)}" y="${f(y-H)}" width="${f(W*.38)}" height="${f(H)}" fill="#000" opacity=".13"/>
  <path d="M${f(l-4*s)} ${f(y-H+1.5*s)}L${f(x)} ${f(y-H-R)}L${f(l+W+4*s)} ${f(y-H+1.5*s)}Z" fill="${o.roof}"/>
  <path d="M${f(x)} ${f(y-H-R)}L${f(l+W+4*s)} ${f(y-H+1.5*s)}H${f(x)}Z" fill="#000" opacity=".15"/>
  ${o.snow?`<path d="M${f(l-5*s)} ${f(y-H+2*s)}L${f(x)} ${f(y-H-R-2*s)}L${f(l+W+5*s)} ${f(y-H+2*s)}L${f(l+W+1*s)} ${f(y-H+3.5*s)}L${f(x+W*.25)} ${f(y-H-R*.45)}L${f(x)} ${f(y-H-R+2.5*s)}L${f(l+W*.2)} ${f(y-H-R*.4)}L${f(l-1*s)} ${f(y-H+3.5*s)}Z" fill="${o.snow}"/>`:''}
  <path d="M${f(l-4*s)} ${f(y-H+1.5*s)}L${f(x)} ${f(y-H-R)}L${f(l+W+4*s)} ${f(y-H+1.5*s)}" fill="none" stroke="${o.trim}" stroke-width="${f(1.5*s)}" stroke-linejoin="round" stroke-linecap="round"/>
  ${win(l+W*.1)}${win(l+W*.72)}
  <rect x="${f(l+W*.42)}" y="${f(y-H*.66)}" width="${f(W*.17)}" height="${f(H*.66)}" fill="${o.door}"/>
  <path d="M${f(l)} ${f(y-H)}V${f(y)}M${f(l+W)} ${f(y-H)}V${f(y)}" stroke="${o.trim}" stroke-width="${f(1.4*s)}"/>`;};
const smoke=(x,y,c='#FFFFFF',op=.85)=>[0,1,2].map(i=>`<circle class="a-smoke" style="animation-delay:${-i*1.3}s" cx="${x}" cy="${y}" r="${3+i*.4}" fill="${c}" opacity="${op}"/>`).join('');
const cloud=(x,y,s,c='#FFFFFF',sh='#E7EEF1',cls='a-drift',d=0)=>`<g class="${cls}" style="animation-delay:${d}s"><g transform="translate(${x} ${y}) scale(${s})"><path d="M0 26C-1 18 6 12 14 14C16 5 26 0 35 3C42-3 55 1 56 11C63 9 70 15 69 26Z" fill="${c}"/><path d="M3 26C10 22 20 22 27 25C35 21 47 21 54 25C59 22 65 22 69 26Z" fill="${sh}"/></g></g>`;
const birds=(x,y,c,n=3,s=1)=>{const r=rng(x*7+y);let o='';for(let i=0;i<n;i++){const bx=x+i*14*s+r()*6,by=y+(i%2?-8:2)*s+r()*4,w=(5+r()*2)*s,fd=f(.42+r()*.22),dl=f(-r());o+=`<g transform="translate(${f(bx)} ${f(by)})"><g class="a-glide" style="animation-delay:${f(-r()*3)}s"><path class="a-wingL" style="animation-duration:${fd}s;animation-delay:${dl}s" d="M${f(-w)} ${f(-w*.5)}Q${f(-w*.4)} ${f(-w*.7)} 0 0" stroke="${c}" stroke-width="${f(1.5*s)}" fill="none" stroke-linecap="round"/><path class="a-wingR" style="animation-duration:${fd}s;animation-delay:${dl}s" d="M${f(w)} ${f(-w*.5)}Q${f(w*.4)} ${f(-w*.7)} 0 0" stroke="${c}" stroke-width="${f(1.5*s)}" fill="none" stroke-linecap="round"/><circle r="${f(.9*s)}" fill="${c}"/></g></g>`;}const dur=f(30+r()*14),x0=-(x+70),x1=440-x,del=f(-(x+70)/(x1-x0)*dur);return `<g class="a-cross" style="--x0:${x0}px;--x1:${x1}px;animation-duration:${dur}s;animation-delay:${del}s">${o}</g>`;};
const crescent=(cx,cy,r,c,id)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" mask="url(#${id})"/>`;
const shimmer=(rows,c,d=0)=>`<g class="a-shimmer" style="animation-delay:${d}s">${rows.map(([x,y,w])=>`<rect x="${f(x-w/2)}" y="${y}" width="${w}" height="2.6" rx="1.3" fill="${c}"/>`).join('')}</g>`;
const lantern=(x,chain,s,c,glass,delay)=>{const L=`<path d="M0 0V${chain}" stroke="${c}" stroke-width="${1.6/s}"/><circle class="a-glow" cx="0" cy="${chain+38}" r="28" fill="${glass}" fill-opacity=".3"/><path d="M-4 ${chain}h8v4h-8Z" fill="${c}"/><path d="M-13 ${chain+14}L0 ${chain+3}L13 ${chain+14}Z" fill="${c}"/><rect x="-15" y="${chain+13}" width="30" height="5" rx="1.5" fill="${c}"/><path d="M-11 ${chain+18}H11L13 ${chain+50}H-13Z" fill="${c}"/><path d="M-7 ${chain+48}V${chain+30}Q0 ${chain+19} 7 ${chain+30}V${chain+48}Z" fill="${glass}"/><path d="M-3 ${chain+44}Q0 ${chain+32} 3 ${chain+44}Z" fill="#FFF6D6"/><rect x="-16" y="${chain+50}" width="32" height="5" rx="1.5" fill="${c}"/><path d="M-6 ${chain+55}L0 ${chain+64}L6 ${chain+55}Z" fill="${c}"/><circle cx="0" cy="${chain+66}" r="1.8" fill="${c}"/>`;return `<g transform="translate(${x} 0) scale(${s})"><g class="a-sway" style="animation-delay:${delay}s">${L}</g></g>`;};
const palm=(x,y,h,c1,c2,trunk,lean=6,d=0)=>{const tx=x+lean,ty=y-h;let rings='';for(let i=1;i<7;i++){const t=i/7,px=x+lean*t*t,py=y-h*t;rings+=`<path d="M${f(px-3)} ${f(py)}h6" stroke="#000" stroke-opacity=".18" stroke-width="1.2"/>`;}
  const fr=(a,len,col)=>{const rad=a*Math.PI/180,ex=tx+Math.cos(rad)*len,ey=ty+Math.sin(rad)*len,mx=tx+Math.cos(rad)*len*.5,my=ty+Math.sin(rad)*len*.5-len*.28,nx=-Math.sin(rad)*5,ny=Math.cos(rad)*5;return `<path d="M${f(tx)} ${f(ty)}Q${f(mx-nx)} ${f(my-ny)} ${f(ex)} ${f(ey)}Q${f(mx+nx*.4)} ${f(my+ny*.4+3)} ${f(tx)} ${f(ty)}Z" fill="${col}"/>`;};
  return `<g class="a-sway-base" style="animation-delay:${d}s"><path d="M${x-3.5} ${y}Q${f(x+lean*.3)} ${f(y-h*.5)} ${f(tx-2)} ${f(ty)}H${f(tx+2)}Q${f(x+lean*.3+4)} ${f(y-h*.5)} ${x+3.5} ${y}Z" fill="${trunk}"/>${rings}${fr(200,h*.42,c1)}${fr(-20,h*.42,c1)}${fr(150,h*.38,c2)}${fr(30,h*.38,c2)}${fr(235,h*.32,c1)}${fr(-55,h*.32,c1)}${fr(105,h*.26,c2)}${fr(75,h*.26,c2)}<circle cx="${f(tx-2)}" cy="${f(ty+4)}" r="2.4" fill="#9A5A2E"/><circle cx="${f(tx+2.5)}" cy="${f(ty+5)}" r="2.4" fill="#9A5A2E"/><circle cx="${f(tx)}" cy="${f(ty+8)}" r="2.4" fill="#86491F"/></g>`;};
const tree=(x,y,s,cs)=>`<rect x="${f(x-1.6*s)}" y="${f(y-12*s)}" width="${f(3.2*s)}" height="${f(12*s)}" fill="#6B4A36"/><circle cx="${f(x)}" cy="${f(y-18*s)}" r="${f(10*s)}" fill="${cs[0]}"/><path d="M${f(x)} ${f(y-28*s)}A${f(10*s)} ${f(10*s)} 0 0 1 ${f(x)} ${f(y-8*s)}Z" fill="${cs[1]}"/>`;

const S={};

S.morgen=()=>`<rect width="400" height="240" fill="#E3EEEC"/>
<g class="a-rise"><circle cx="300" cy="122" r="66" fill="#F2E6C2" opacity=".55"/><circle cx="300" cy="122" r="46" fill="#F3DBA0" opacity=".6"/><circle cx="300" cy="122" r="26" fill="#F2BE4E"/></g>
${cloud(186,40,.9,'#FFFFFF','#E4EDEB','a-drift')}${cloud(352,28,.55,'#FFFFFF','#E4EDEB','a-drift',-4)}
${birds(214,84,'#587470',3,.9)}
<path d="M0 156L36 136L64 146L112 108L150 134L186 122L222 98L262 126L300 112L340 128L372 116L400 124V174H0Z" fill="#C2D9D4"/>

${[196,384].map(x=>`<rect x="${x-4}" y="70" width="8" height="90" fill="#FBF7EF"/><rect x="${x}" y="70" width="4" height="90" fill="#E9DDC8"/><rect x="${x-6}" y="96" width="12" height="3" fill="#E1D2BA"/><rect x="${x-6}" y="122" width="12" height="3" fill="#E1D2BA"/><path d="M${x-4} 70L${x} 54L${x+4} 70Z" fill="#E1D2BA"/><path d="M${x} 54V48" stroke="#D9B84F" stroke-width="1.4"/>`).join('')}
${arcade(132,20,20,14,120,'#FBF7EF','#EAD9BF')}${arcade(152,22,20,14,120,'#F7F0E3','#E3D0B2')}
<rect x="120" y="128" width="280" height="4" fill="#E9DDC8"/>

const ART={
  morgen:{name:'Morgen',bg:'#E3EEEC',anim:'Sola stiger, røyk fra pipa, båten vugger'},
  kveld:{name:'Kveld',bg:'#F5D8C5',anim:'Sola synker, vinduet lyser'},
  sovn:{name:'Før søvn',bg:'#2C4470',night:true,anim:'Nordlyset bølger, stjerner blinker'},
  etterBonnen:{name:'Etter bønnen',bg:'#EDF4F0',anim:'Støv svever i lyset, planten vugger'},
  adhan:{name:'Etter adhan',bg:'#DCE7F5',anim:'Lydbølger fra minareten'},
  wudu:{name:'Wudu og moské',bg:'#EEF4F2',anim:'Vannet renner, dråper faller'},
  reise:{name:'Reise',bg:'#D8E8F5',anim:'Flyet svever over skyene'},
  bekymring:{name:'Bekymring og lettelse',bg:'#E8E4F4',anim:'Regnet faller, sola kommer fram'},
  tilgivelse:{name:'Tilgivelse',bg:'#E3F1E9',anim:'Blader faller, tåka driver'},
  lovprisning:{name:'Lovprisning',bg:'#F7EFD8',anim:'Solstråler dreier, fugler flyr'},
  koranen:{name:'Fra Koranen',bg:'#DDEDE6',anim:'Lampa flakker, lyset puster'},
  salawat:{name:'Salawat',bg:'#F4E0E3',anim:'Palmene vugger, gnister'},
  sunnah:{name:'Sunnah',bg:'#DDEBF3',anim:'Palmene vugger i oasen'},
  beskyttelse:{name:'Beskyttelse',bg:'#D7DFF2',anim:'Snøen faller, lykta gløder'},
  ramadan:{name:'Ramadan',bg:'#E3DCF1',anim:'Lyktene svinger, vinduer tennes'},
  eid:{name:'Eid',bg:'#F8E4D9',anim:'Vimpler vaier, teen damper'},
  hajj:{name:'Hajj',bg:'#F4E8D4',anim:'Tawaf rundt Kaba'}
};
const DEFS=(()=>{const r=rng(99);let g='';for(let i=0;i<14;i++)g+=`<circle cx="${f(r()*24)}" cy="${f(r()*24)}" r="${f(.4+r()*.5)}" fill="${i%3?'#FFFFFF':'#000000'}" opacity="${i%3?.28:.06}"/>`;
const m=(id,cx,cy,r,dx,dy,rr)=>`<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="240"><rect width="400" height="240" fill="#fff"/><circle cx="${cx+dx}" cy="${cy+dy}" r="${rr}" fill="#000"/></mask>`;
return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">${g}</pattern><pattern id="tile" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#D6ECE7"/><path d="M9 2L16 9L9 16L2 9Z" fill="#A5D4CA"/><path d="M9 5.5L12.5 9L9 12.5L5.5 9Z" fill="#F4FAF8"/><circle cx="0" cy="0" r="2" fill="#5FAF9E"/><circle cx="18" cy="0" r="2" fill="#5FAF9E"/><circle cx="0" cy="18" r="2" fill="#5FAF9E"/><circle cx="18" cy="18" r="2" fill="#5FAF9E"/></pattern>${m('moonM',350,52,14,6,-5,12)}${m('smallM',248,104,4,1.8,-1.4,3.4)}${m('moonS',334,56,8,3.4,-3,7)}${m('moonR',296,118,13,5,-4,11)}</defs></svg>`;})();
const sceneSVG=(k,par='xMaxYMid slice')=>`<svg class="art" viewBox="0 0 400 240" preserveAspectRatio="${par}" aria-hidden="true">${S[k]()}</svg>`;

document.body.insertAdjacentHTML('afterbegin',DEFS);
const svgOf=k=>sceneSVG(k);
const tile=(k,opt={})=>{const a=ART[k];return `<div class="tile${opt.cls?' '+opt.cls:''}${a.night?' night':''}" style="background:${a.bg}" role="button" tabindex="0"><div class="lbl">${opt.kicker?`<small>${opt.kicker}</small>`:''}<b>${opt.name||a.name}</b>${opt.count?`<small>${opt.count}</small>`:''}</div>${svgOf(k)}</div>`;};
const counts={morgen:'14',kveld:'14',sovn:'7',etterBonnen:'15',adhan:'3',wudu:'3',reise:'9',bekymring:'17',tilgivelse:'14',lovprisning:'20',koranen:'34',salawat:'4',sunnah:'48',beskyttelse:'6',ramadan:'4',eid:'2',hajj:'5'};
const c=k=>counts[k]+' duaer';
document.getElementById('feed').innerHTML=
  tile('etterBonnen',{cls:'hero',kicker:'Nå, etter Dhuhr',count:c('etterBonnen')})+
  `<div class="sec">Dagen</div>`+tile('morgen',{cls:'wide',count:c('morgen')})+tile('kveld',{cls:'wide',count:c('kveld')})+tile('sovn',{cls:'wide',count:c('sovn')})+
  `<div class="sec">Rundt bønnen</div><div class="grid2">${tile('adhan',{count:c('adhan')})}${tile('wudu',{count:c('wudu')})}</div>`+
  `<div class="sec">Hverdag</div><div class="grid2">${['reise','bekymring','tilgivelse','beskyttelse'].map(k=>tile(k,{count:c(k)})).join('')}</div>`+
  `<div class="sec">Lovprisning og Koranen</div><div class="grid2">${['lovprisning','koranen','salawat','sunnah'].map(k=>tile(k,{count:c(k),name:k==='sunnah'?'Sunnah':undefined})).join('')}</div>`+
  `<div class="sec">Høytider</div><div class="grid2">${tile('ramadan',{count:c('ramadan')})}${tile('eid',{count:c('eid')})}</div>`+tile('hajj',{cls:'wide',count:c('hajj')});
document.getElementById('lib').innerHTML=Object.keys(ART).map(k=>`<div class="item">${tile(k)}<div class="meta"><b>${ART[k].name}</b><span>${ART[k].anim}</span><code>${k}</code></div></div>`).join('');
const btn=document.getElementById('toggle'),root=document.getElementById('root');
btn.addEventListener('click',()=>{const p=root.classList.toggle('paused');btn.setAttribute('aria-pressed',String(p));btn.textContent=p?'Spill animasjon':'Pause animasjon';});
</script>

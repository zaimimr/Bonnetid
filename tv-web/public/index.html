<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F6F4">
<title>Bønnetid TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap">
<link rel="stylesheet" href="screens.css">
<style>
:root {
  --page: #F3F6F4;
  --card: #FFFFFF;
  --sunken: #E9EEEB;
  --line: #DCE3DF;
  --off: #C3CEC8;
  --ink: #182420;
  --body: #3E4C46;
  --muted: #56655E;
  --brand: #0C6B52;
  --brand-ink: #08503D;
  --brand-soft: #E2F0EA;
  --bezel: #101714;
  --warn: #6B2A12;
  --warn-soft: #FBEDE6;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --z-sticky: 10;
  --z-overlay: 20;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

#app { max-width: 1180px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

.top { padding: max(16px, env(safe-area-inset-top)) 0 12px; }
.mosque { display: flex; align-items: center; gap: 12px; }
.mosque-text { flex: 1; min-width: 0; display: grid; gap: 1px; }
.eyebrow { font-size: 14px; color: var(--muted); }
.mosque b { font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.where { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); margin-top: 2px; }
.where svg { flex: none; }

.tool {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap;
  transition: background-color .15s var(--ease), transform .15s var(--ease);
}
.tool:active { transform: scale(.97); background: var(--sunken); }
.tool.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.tool.icon-only { width: 44px; padding: 0; }

.stage {
  position: sticky; top: 0; z-index: var(--z-sticky);
  margin: 0 -16px; padding: 8px 16px 10px;
  background: var(--page);
}
.tv-shell { position: relative; padding: 5px; border-radius: 16px; background: var(--bezel); box-shadow: 0 10px 28px -14px rgba(16, 23, 20, .55); }
.tv-shell .frame { border-radius: 11px; }
.frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--sunken); }
.canvas { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(var(--s, .1)); transform-origin: 0 0; pointer-events: none; }
.fade .canvas { animation: fade .45s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.progress { position: absolute; left: 16px; right: 16px; bottom: 12px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .35); overflow: hidden; }
.progress i { display: block; height: 100%; background: #fff; transform-origin: 0 50%; animation: grow var(--d) linear forwards; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.stage-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.stage-title { flex: 1; min-width: 0; display: grid; }
.stage-title b { font-size: 18px; line-height: 1.25; }
.stage-title span { font-size: 15px; color: var(--muted); }
.stage-actions { display: flex; gap: 8px; }
.status-row { min-height: 22px; margin-top: 6px; font-size: 14px; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.status.ok { color: var(--brand-ink); animation: fade .3s var(--ease); }
.status.err { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

.controls { display: grid; gap: 16px; min-width: 0; }

.strip-wrap { margin: 0 -16px; padding: 6px 16px 10px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: 16px; scrollbar-width: none; overscroll-behavior-x: contain; }
.strip-wrap::-webkit-scrollbar { display: none; }
.strip { display: flex; gap: 20px; width: max-content; }
.group { display: grid; gap: 8px; }
.group-label { font-size: 14px; font-weight: 600; color: var(--muted); }
.group-row { display: flex; gap: 10px; }
.thumb { width: 128px; display: grid; gap: 6px; scroll-snap-align: start; }
.thumb-img { position: relative; display: block; border-radius: 9px; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .2s var(--ease); }
.thumb-img .frame { border-radius: 9px; }
.thumb.off .frame { filter: grayscale(1); opacity: .45; }
.thumb.sel .thumb-img { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ink); }
.thumb:active .thumb-img { transform: scale(.97); }
.thumb-name { font-size: 14px; font-weight: 500; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.sel .thumb-name { color: var(--ink); font-weight: 700; }
.badge { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; box-shadow: 0 0 0 2px var(--page); }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 6px; display: grid; gap: 18px; }
.panel-head { display: grid; gap: 2px; }
.panel-head h2 { font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.when { font-size: 15px; color: var(--muted); }
.field { display: grid; gap: 10px; }
.field-label { font-size: 15px; font-weight: 600; color: var(--body); }

.list { display: grid; margin: 0 -16px; }
.panel > .list:last-child, .field:last-child > .list { margin-bottom: 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 16px; border-top: 1px solid var(--line); }
.row-label { flex: 1; }
.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: 16px; background: var(--off); transition: background-color .2s var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(24, 36, 32, .3); transition: transform .22s var(--ease); }
[aria-checked="true"] > .switch { background: var(--brand); }
[aria-checked="true"] > .switch::after { transform: translateX(20px); }
.row:active { background: var(--page); }

.note { display: flex; align-items: center; gap: 8px; margin-top: -8px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 15px; font-weight: 600; }
.note svg { flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card);
  font-size: 16px; font-weight: 500; color: var(--body);
  transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
}
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.chips.fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.chip.font { display: grid; justify-items: center; gap: 2px; padding: 10px 8px; border-radius: 14px; font-size: 14px; }
.chip.font .ar { font-size: 24px; line-height: 1.5; color: var(--ink); direction: rtl; }

.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; border: 1px solid transparent; font-size: 14px; font-weight: 500; color: var(--body); }
.swatch span { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch[aria-pressed="true"] { border-color: var(--line); background: var(--page); color: var(--ink); font-weight: 700; }
.swatch[aria-pressed="true"] span { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--sunken); }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--body); text-align: center; transition: background-color .15s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--card); border-color: var(--line); color: var(--ink); box-shadow: 0 1px 2px rgba(24, 36, 32, .08); }

.picker { display: grid; gap: 12px; }
.picker.first { padding-top: max(40px, env(safe-area-inset-top)); }
.picker.first h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { font-size: 21px; }
.search { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.search input { flex: 1; min-width: 0; height: 52px; border: 0; outline: 0; background: none; color: var(--ink); font-size: 17px; }
.search input::placeholder { color: var(--muted); }
.results { list-style: none; margin: 0; padding: 0; border-radius: 16px; border: 1px solid var(--line); background: var(--card); overflow: hidden; }
.results li + li { border-top: 1px solid var(--line); }
.results button { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; }
.results button:active { background: var(--page); }
.results b { font-weight: 600; }
.results span { grid-column: 1; font-size: 15px; color: var(--muted); }
.results svg { grid-row: 1 / span 2; grid-column: 2; color: var(--brand); }
.hint { color: var(--muted); font-size: 15px; padding: 4px 4px 0; }

dialog { border: 0; padding: 0; color: var(--ink); }
#sheet { width: 100%; max-width: 560px; max-height: none; height: min(88dvh, 720px); margin: auto auto 0; border-radius: 22px 22px 0 0; background: var(--page); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; }
#sheet::backdrop { background: rgba(10, 18, 15, .5); }
#sheet[open] { animation: rise .3s var(--ease); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 700px) {
  #sheet { margin: auto; border-radius: 22px; height: min(80dvh, 720px); }
}

#full { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; background: #000; overflow: hidden; }
#full::backdrop { background: #000; }
.full-wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
.full-tv { position: absolute; top: 50%; left: 50%; width: min(100vw, 100dvh * 16 / 9); transform: translate(-50%, -50%); }
.full-close { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); background: rgba(255, 255, 255, .92); border-color: transparent; }
@media (orientation: portrait) {
  .full-tv { width: min(100dvh - 24px, (100vw - 8px) * 16 / 9); transform: translate(-50%, -50%) rotate(90deg); }
}

.empty { display: grid; gap: 8px; justify-items: center; text-align: center; padding: max(96px, 18dvh) 16px 0; }
.empty h1 { font-size: 24px; }
.empty p { color: var(--muted); max-width: 32ch; }
.loading { display: grid; gap: 14px; padding-top: max(24px, env(safe-area-inset-top)); }
.loading i { display: block; border-radius: 14px; background: var(--sunken); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .5; } }

@media (min-width: 900px) {
  #app { padding: 0 32px 48px; }
  .top { padding-top: 32px; padding-bottom: 20px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr); gap: 32px; align-items: start; }
  .stage { top: 24px; margin: 0; padding: 0; }
  .strip-wrap { margin: 0; padding: 6px 2px 10px; }
  .strip { width: auto; flex-direction: column; gap: 14px; }
  .group-row { flex-wrap: wrap; }
  .thumb { width: calc((100% - 30px) / 4); min-width: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .progress i { animation-duration: var(--d) !important; }
}
</style>
</head>
<body>
<main id="app"><div class="loading" aria-label="Henter innstillingene"><i style="height:52px;width:60%"></i><i style="aspect-ratio:16/9"></i><i style="height:120px"></i></div></main>
<dialog id="sheet" aria-label="Bytt moské"></dialog>
<dialog id="full" aria-label="Forhåndsvisning i fullskjerm"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>

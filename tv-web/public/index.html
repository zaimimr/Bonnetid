<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bønnetid TV</title>
<style>
:root {
  --page: #F6F8F7;
  --card: #FFFFFF;
  --line: #DDE4E0;
  --text: #182420;
  --body: #3E4C46;
  --muted: #5F6E67;
  --brand: #0C6B52;
  --brand-soft: #E9F4EF;
  --warn: #4F3F0A;
  --warn-soft: #FBF3DC;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 18px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 120px; }
h1 { font-size: 30px; line-height: 1.15; margin: 8px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 21px; margin: 32px 0 10px; }
p { margin: 0; color: var(--body); }
.sub { color: var(--muted); font-size: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .name { flex: 1; font-weight: 600; }
.row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 15px; }
button, select, input { font: inherit; color: inherit; }
.switch { position: relative; width: 56px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 17px; background: var(--line); transition: background .2s ease-out; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(24,36,32,.25); transition: transform .2s ease-out; }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:focus-visible + span { outline: 3px solid var(--text); outline-offset: 2px; }
.move { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; cursor: pointer; }
.move:disabled { opacity: .3; cursor: default; }
.order { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 72px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.seg button small { display: block; font-weight: 400; font-size: 13px; opacity: .8; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.swatches button { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text); }
select { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); max-width: 55%; }
input[type="search"] { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.results { margin-top: 8px; }
.results button { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: var(--card); cursor: pointer; }
.results button:first-child { border-top: 0; }
.results button[aria-pressed="true"] { background: var(--brand-soft); }
.results small { display: block; color: var(--muted); font-size: 15px; }
.current { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.current b { display: block; }
.link { border: 0; background: none; color: var(--brand); font-weight: 600; cursor: pointer; padding: 8px; }
details { border-top: 1px solid var(--line); }
details:first-child { border-top: 0; }
summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; font-size: 26px; color: var(--muted); transition: transform .2s ease-out; }
details[open] summary::after { transform: rotate(90deg); }
details .row { padding-left: 28px; }
.note { margin-top: 10px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 16px; }
.status { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 20px; border-radius: 24px; font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .2s ease-out; pointer-events: none; white-space: nowrap; }
.status.show { opacity: 1; }
.empty { text-align: center; padding: 64px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"><div class="empty"><p>Henter innstillingene</p></div></main>
<div class="status" id="status" role="status" aria-live="polite"></div>
<script>
const SCREENS = { main: 'Bønnesal', lobby: 'Inngang', plakat: 'Reklameskjerm', rad: 'Sal 2' };
const SCREEN_HELP = {
  main: 'Alle dagens bønnetider i stort format',
  lobby: 'Neste bønn, dagens tider og kunngjøringer',
  plakat: 'Kunngjøringer og Vipps-kode i stort format',
  rad: 'Dagens tider med en tegning og navnet på rommet',
};
const SECONDS = [[10, 'Raskt'], [20, 'Anbefalt'], [30, 'Rolig'], [60, 'Svært rolig']];
const BRANDS = [['#0C6B52', 'Grønn'], ['#1F4E8C', 'Blå'], ['#7A2E3B', 'Vinrød'], ['#4A3F8C', 'Lilla']];
const ARTS = [['mosque', 'Moské'], ['kaaba', 'Kaaba'], ['lantern', 'Lykt'], ['moon', 'Måne og stjerner'], ['none', 'Ingen tegning']];
const HALLS = ['Hovedsalen', 'Kvinneavdelingen', 'Sal 2', 'Ungdomssalen', 'Kafeen'];
const FONTS = [['Amiri', 'Amiri'], ['ScheherazadeNew', 'Scheherazade'], ['NotoNaskhArabic', 'Naskh'], ['ReemKufi', 'Kufi'], ['ArefRuqaa', 'Ruqaa'], ['NotoNastaliqUrdu', 'Nastaliq']];
const PER_SCREEN = [
  ['Bønnesal', [['hide', 'main.fajrEnd', 'Fajr slutter'], ['hide', 'main.timeline', 'Tidslinje'], ['hide', 'main.note', 'Kunngjøring og Vipps'], ['hide', 'main.hijri', 'Hijri-dato']]],
  ['Inngang', [['hide', 'lobby.times', 'Dagens tider'], ['hide', 'lobby.note', 'Kunngjøring'], ['hide', 'lobby.vipps', 'Vipps-kode']]],
  ['Reklameskjerm', [['hide', 'plakat.note', 'Kunngjøring'], ['hide', 'plakat.vipps', 'Vipps-kode']]],
  ['Sal 2', [['select', 'art', 'Tegning', ARTS], ['select', 'hall', 'Navn på rommet', HALLS.map((h) => [h, h])], ['hide', 'rad.fajrEnd', 'Fajr slutter'], ['hide', 'rad.timeline', 'Tidslinje']]],
  ['Iqamah', [['select', 'iqamahLead', 'Start nedtellingen', [[5, '5 min før'], [10, '10 min før'], [15, '15 min før']]], ['hide', 'iqamah.tips', 'Påminnelser']]],
  ['Jumuah', [['hide', 'jumuah.vipps', 'Fredagsinnsamling med Vipps']]],
  ['Taraweeh-dua', [['select', 'duaFont', 'Skrift', FONTS], ['flag', 'translation', 'Norsk oversettelse']]],
  ['Natt', [['flag', 'dim', 'Demp skjermen']]],
];

const [id, secret] = location.hash.slice(1).split('.');
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
let config = null;
let mosques = [];
let query = '';
let picking = false;
let note = '';
let timer = null;
let statusTimer = null;

function esc(text) {
  return String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function place(name) {
  return String(name ?? '').toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, gap, letter) => gap + letter.toUpperCase()).replace(/ (I|Og|På) /g, (w) => w.toLowerCase());
}
function flash(text, stay) {
  statusEl.textContent = text;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  if (!stay) statusTimer = setTimeout(() => statusEl.classList.remove('show'), 2200);
}
async function call(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}
function change(patch) {
  config = { ...config, ...patch };
  render();
  flash('Lagrer…', true);
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      const saved = await call('/api/save', { id, secret, source: 'phone', config });
      config = saved.config;
      flash('Lagret. TV-en oppdateres innen et halvt minutt.');
    } catch {
      flash('Fikk ikke lagret. Prøv igjen.');
    }
  }, 500);
}
function toggleHide(key, shown) {
  const hide = new Set(config.hide ?? []);
  if (shown) hide.delete(key); else hide.add(key);
  change({ hide: [...hide] });
}
function switchHtml(attrs, checked, label) {
  return `<label class="switch"><input type="checkbox" ${attrs} ${checked ? 'checked' : ''} aria-label="${esc(label)}"><span></span></label>`;
}

function mosqueSection() {
  const current = mosques.find((m) => m.orgNr === config.orgNr);
  if (!picking && current) {
    return `<div class="card current"><div><b>${esc(current.name)}</b><span class="sub">${esc([current.address, place(current.city)].filter(Boolean).join(', '))}</span></div><button class="link" data-act="pick">Bytt</button></div>`;
  }
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hits = words.length
    ? mosques.filter((m) => words.every((w) => `${m.name} ${m.city ?? ''} ${m.address ?? ''}`.toLowerCase().includes(w))).slice(0, 30)
    : [];
  return `<input type="search" id="search" placeholder="Søk på navn eller sted" value="${esc(query)}" autocomplete="off">
    ${hits.length ? `<div class="card results">${hits.map((m) => `<button data-org="${esc(m.orgNr)}" aria-pressed="${m.orgNr === config.orgNr}">${esc(m.name)}<small>${esc([m.address, place(m.city)].filter(Boolean).join(', '))}</small></button>`).join('')}</div>` : words.length ? '<p class="sub" style="margin-top:8px">Fant ingen moské</p>' : ''}`;
}

function rotationSection() {
  const rotation = config.rotation ?? ['main'];
  const order = [...rotation, ...Object.keys(SCREENS).filter((s) => !rotation.includes(s))];
  return `<div class="card">${order.map((screen) => {
    const pos = rotation.indexOf(screen);
    const on = pos >= 0;
    return `<div class="row">
      <span class="order">${on ? pos + 1 : ''}</span>
      <span class="name">${SCREENS[screen]}<small>${SCREEN_HELP[screen]}</small></span>
      ${on && rotation.length > 1 ? `<button class="move" data-move="${screen}" data-dir="-1" ${pos === 0 ? 'disabled' : ''} aria-label="Flytt ${SCREENS[screen]} opp">↑</button><button class="move" data-move="${screen}" data-dir="1" ${pos === rotation.length - 1 ? 'disabled' : ''} aria-label="Flytt ${SCREENS[screen]} ned">↓</button>` : ''}
      ${switchHtml(`data-screen="${screen}"`, on, SCREENS[screen])}
    </div>`;
  }).join('')}</div>
  ${note ? `<div class="note">${esc(note)}</div>` : ''}
  <p class="sub" style="margin-top:10px">Iqamah, Jumuah, Ramadan, natt og Eid kommer av seg selv når det er tid.</p>
  ${rotation.length > 1 ? `<h2>Tid per skjerm</h2><div class="seg">${SECONDS.map(([s, label]) => `<button data-seconds="${s}" aria-pressed="${config.seconds === s}">${s} sek<small>${label}</small></button>`).join('')}</div>` : ''}`;
}

function controlHtml([kind, key, label, options]) {
  if (kind === 'hide') {
    const shown = !(config.hide ?? []).includes(key);
    return `<div class="row"><span class="name">${esc(label)}</span>${switchHtml(`data-hide="${key}"`, shown, label)}</div>`;
  }
  if (kind === 'flag') {
    return `<div class="row"><span class="name">${esc(label)}</span>${switchHtml(`data-flag="${key}"`, !!config[key], label)}</div>`;
  }
  return `<div class="row"><span class="name">${esc(label)}</span><select data-select="${key}" aria-label="${esc(label)}">${options.map(([value, name]) => `<option value="${esc(value)}" ${String(config[key]) === String(value) ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></div>`;
}

function render() {
  if (!config) return;
  const open = [...document.querySelectorAll('details[open]')].map((d) => d.dataset.name);
  const focusedSearch = document.activeElement?.id === 'search';
  app.innerHTML = `
    <h1>Skjermen i moskeen</h1>
    <p class="sub">Endringer lagres med en gang og vises på TV-en innen et halvt minutt.</p>
    <h2>Moské</h2>${mosqueSection()}
    <h2>Skjermer som vises</h2>${rotationSection()}
    <h2>Hva som vises på hver skjerm</h2>
    <div class="card">${PER_SCREEN.map(([name, controls]) => `<details data-name="${esc(name)}" ${open.includes(name) ? 'open' : ''}><summary>${esc(name)}</summary>${controls.map(controlHtml).join('')}</details>`).join('')}</div>
    <h2>Farge</h2>
    <div class="swatches">${BRANDS.map(([hex, name]) => `<button data-brand="${hex}" style="background:${hex}" aria-label="${name}" aria-pressed="${config.brand === hex}"></button>`).join('')}</div>
    <div class="card" style="margin-top:16px"><div class="row"><span class="name">Mønster i bakgrunnen</span>${switchHtml('data-flag="texture"', !!config.texture, 'Mønster i bakgrunnen')}</div></div>`;
  if (focusedSearch) {
    const input = document.getElementById('search');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

app.addEventListener('input', (event) => {
  if (event.target.id === 'search') {
    query = event.target.value;
    render();
  }
});
app.addEventListener('change', (event) => {
  const t = event.target;
  if (t.dataset.screen) {
    const rotation = config.rotation ?? ['main'];
    if (!t.checked && rotation.length === 1) {
      note = 'Minst én skjerm må være på.';
      render();
      return;
    }
    note = '';
    change({ rotation: t.checked ? [...rotation, t.dataset.screen] : rotation.filter((s) => s !== t.dataset.screen) });
  } else if (t.dataset.hide) {
    toggleHide(t.dataset.hide, t.checked);
  } else if (t.dataset.flag) {
    change({ [t.dataset.flag]: t.checked });
  } else if (t.dataset.select) {
    const key = t.dataset.select;
    change({ [key]: key === 'iqamahLead' ? Number(t.value) : t.value });
  }
});
app.addEventListener('click', (event) => {
  const b = event.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'pick') {
    picking = true;
    render();
    document.getElementById('search')?.focus();
  } else if (b.dataset.org) {
    picking = false;
    query = '';
    change({ orgNr: b.dataset.org, configured: true });
  } else if (b.dataset.move) {
    const rotation = [...config.rotation];
    const from = rotation.indexOf(b.dataset.move);
    const to = from + Number(b.dataset.dir);
    [rotation[from], rotation[to]] = [rotation[to], rotation[from]];
    change({ rotation });
  } else if (b.dataset.seconds) {
    change({ seconds: Number(b.dataset.seconds) });
  } else if (b.dataset.brand) {
    change({ brand: b.dataset.brand });
  }
});

async function start() {
  if (!id || !secret) {
    app.innerHTML = '<div class="empty"><h1>Skann koden på TV-en</h1><p class="sub">Hold inne OK på fjernkontrollen og velg «Bruk mobilen».</p></div>';
    return;
  }
  try {
    const [loaded, list] = await Promise.all([
      call('/api/load', { id, secret }),
      fetch('/api/mosques').then((r) => (r.ok ? r.json() : [])),
    ]);
    mosques = list.filter((m) => m.name);
    config = loaded.config ?? {};
    picking = !config.orgNr;
    render();
  } catch (error) {
    const gone = error.message === '403' || error.message === '404';
    app.innerHTML = `<div class="empty"><h1>${gone ? 'Koden virker ikke lenger' : 'Fikk ikke kontakt'}</h1><p class="sub">${gone ? 'Skann den nye koden på TV-en.' : 'Sjekk nettet og last siden på nytt.'}</p></div>`;
  }
}
start();
</script>
</body>
</html>

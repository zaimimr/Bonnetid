              - textbox "What's New in This Version" [ref=f4e319]: "- Widget på hjemskjerm og låseskjerm: neste bønn med nedtelling - Live-aktivitet i Dynamic Island mens bønnen pågår - Bønnesporing du kan slå på: marker bønner som bedt, på egen side under Mer - Ramadan-modus med påminnelse før suhoor - Jummah-tiden fra moskeen din vises også når du er i en annen kommune - Full iPad-støtte og riktig visning ved rotasjon - Bedre lesbarhet ved store tekststørrelser - Rettet tidssone, så bønnetidene alltid følger norsk klokke"

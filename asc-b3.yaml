                - button "More information" [ref=f4e307] [cursor=pointer]: "?"
              - textbox "Description" [ref=f4e309]: "Islamsk Råd Norge lanserer nye standardiserte bønnetider for hele Norge, nå rett på din mobil! Bønnetid kan du stole på. Dette historiske prosjektet, ledet av IRN, har et mangfold av medlemsmoskeer og samarbeidspartnere som Islamic Cultural Centre (ICC) og Det Islamske forbundet (Rabita) med på laget. Funksjoner: * Ikke mist bønnen din, sett opp alarm eller få en lydløs beskjed når bønnen starter. * Velge din by og moske for en personlig tilpasning til appen * Qibla: finn bønneretning på kart eller med kompass * Finn raskt ut når de muslimske helligdagene er med den splitter nye hijrikalenderen * Finn jummah tidene til moskeene i Norge * En standardisert tabell for hele Norge, nå slipper du å finne og sammenligne forskjellige bønnetidstabeller * Og mer funksjoner blir lansert utover 2026 Ta gjerne kontakt med oss på app@irn.no. Terms of use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/"
              - status "Characters remaining" [ref=f4e311]: 3,076
            - generic [ref=f4e312]:
